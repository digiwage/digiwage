name: Build DigiWage Linux x86_64 (Daemon & GUI)

on:
  push:
    branches:
      - digiwage-v3
  pull_request:
    branches:
      - digiwage-v3
  workflow_dispatch:

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: digiwage-v3
          submodules: recursive

      - name: Install Base & Qt Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libtool autotools-dev automake pkg-config \
            bsdmainutils python3 cmake curl g++-x86-64-linux-gnu \
            qtbase5-dev qttools5-dev-tools libqt5dbus5 libqt5widgets5 \
            libqt5svg5-dev qttools5-dev libprotobuf-dev protobuf-compiler libqrencode-dev

      - name: Pre-fetch missing dependency sources
        run: |
          if [ -d "depends" ]; then
            mkdir -p depends/sources
            # Download gmp-6.2.1 directly to bypass bitcoincore.org 404
            if [ ! -f "depends/sources/gmp-6.2.1.tar.xz" ]; then
              echo "Pre-fetching gmp-6.2.1.tar.xz..."
              curl -sL https://ftp.gnu.org/gnu/gmp/gmp-6.2.1.tar.xz -o depends/sources/gmp-6.2.1.tar.xz || \
              curl -sL https://gmplib.org/download/gmp/gmp-6.2.1.tar.xz -o depends/sources/gmp-6.2.1.tar.xz
            fi
          fi

      - name: Build In-Tree Static Dependencies
        run: |
          if [ -d "depends" ]; then
            echo "Building static dependencies in depends/..."
            cd depends
            make -j$(nproc) HOST=x86_64-pc-linux-gnu
            cd ..
          else
            echo "No depends directory found. Installing system fallback libraries..."
            sudo apt-get install -y --no-install-recommends \
              libssl-dev libevent-dev libboost-system-dev libboost-filesystem-dev \
              libboost-chrono-dev libboost-test-dev libboost-thread-dev \
              libdb++-dev libminiupnpc-dev libzmq3-dev
          fi

      - name: Autogen & Configure
        run: |
          ./autogen.sh
          
          if [ -d "depends/x86_64-pc-linux-gnu" ]; then
            # Point PKG_CONFIG_PATH directly to the static depends prefix to find Qt5Svg
            export PKG_CONFIG_PATH="$(pwd)/depends/x86_64-pc-linux-gnu/lib/pkgconfig:$PKG_CONFIG_PATH"
            ./configure --prefix=$(pwd)/depends/x86_64-pc-linux-gnu \
                        --disable-maintainer-mode \
                        --disable-dependency-tracking \
                        --enable-static \
                        --disable-shared \
                        --with-gui=qt5 \
                        LDFLAGS="-static-libgcc -static-libstdc++"
          else
            ./configure --enable-static \
                        --disable-shared \
                        --with-gui=qt5 \
                        LDFLAGS="-static-libgcc -static-libstdc++"
          fi

      - name: Compile Binaries
        run: |
          make -j$(nproc)

      - name: Verify Executable Linkage
        run: |
          echo "=== Inspecting Built Binaries ==="
          ls -la src/digiwaged src/digiwage-cli src/qt/digiwage-qt 2>/dev/null || true
          
          BINARY=$(find src/ -maxdepth 2 -type f \( -name "digiwage-qt" -o -name "digiwaged" \) | head -n 1)
          if [ -n "$BINARY" ]; then
            echo "Inspecting dynamic dependencies for $BINARY:"
            ldd "$BINARY" || true
          fi

      - name: Package Release Binaries
        run: |
          mkdir -p release
          
          cp src/digiwaged release/ 2>/dev/null || cp src/bitcoind release/ 2>/dev/null || true
          cp src/digiwage-cli release/ 2>/dev/null || cp src/bitcoin-cli release/ 2>/dev/null || true
          cp src/qt/digiwage-qt release/ 2>/dev/null || cp src/qt/bitcoin-qt release/ 2>/dev/null || true

          cd release
          tar -czvf digiwage-v3-linux-x86_64.tar.gz *

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: digiwage-v3-linux-x86_64
          path: release/digiwage-v3-linux-x86_64.tar.gz
          retention-days: 30