name: Build DigiWage Linux Binary (Static Toolchain)

on:
  push:
    branches:
      - digiwage-v3
  pull_request:
    branches:
      - digiwage-v3
  workflow_dispatch:

jobs:
  build-linux-static:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: digiwage-v3
          submodules: recursive

      - name: Install Base Build System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libtool autotools-dev automake pkg-config \
            bsdmainutils python3 cmake curl g++-x86-64-linux-gnu

      - name: Build In-Tree Static Dependencies
        run: |
          # If the repository includes the depends system, build static dependencies
          if [ -d "depends" ]; then
            echo "Building static dependencies in depends/..."
            cd depends
            make -j$(nproc) HOST=x86_64-pc-linux-gnu NO_QT=1
            cd ..
          else
            echo "No depends directory found, installing fallback lib packages..."
            sudo apt-get install -y --no-install-recommends \
              libssl-dev libevent-dev libboost-system-dev libboost-filesystem-dev \
              libboost-chrono-dev libboost-test-dev libboost-thread-dev \
              libdb++-dev libminiupnpc-dev libzmq3-dev libprotobuf-dev protobuf-compiler
          fi

      - name: Autogen & Configure
        run: |
          ./autogen.sh
          
          # Pass static flags and prefix if depends was built
          if [ -d "depends/x86_64-pc-linux-gnu" ]; then
            ./configure --prefix=$(pwd)/depends/x86_64-pc-linux-gnu \
                        --disable-maintainer-mode \
                        --disable-dependency-tracking \
                        --enable-static \
                        --disable-shared \
                        LDFLAGS="-static-libgcc -static-libstdc++"
          else
            ./configure --enable-static \
                        --disable-shared \
                        --with-gui=no \
                        LDFLAGS="-static-libgcc -static-libstdc++"
          fi

      - name: Compile Binary
        run: |
          make -j$(nproc)

      - name: Inspect Dynamic Linkage
        run: |
          # Find bitcoind/digiwaged binary
          BINARY=$(find src/ -maxdepth 2 -type f \( -name "digiwaged" -o -name "digiwage-cli" -o -name "bitcoind" \) | head -n 1)
          if [ -z "$BINARY" ]; then
            echo "Executable binary not found in src/"
            exit 1
          fi
          echo "Inspecting dynamic dependencies for $BINARY:"
          ldd "$BINARY" || true

      - name: Package Release
        run: |
          mkdir -p release
          cp src/digiwaged release/ 2>/dev/null || true
          cp src/digiwage-cli release/ 2>/dev/null || true
          cp src/digiwage-qt release/ 2>/dev/null || true
          
          # If names follow standard Bitcoin Core convention
          cp src/bitcoind release/ 2>/dev/null || true
          cp src/bitcoin-cli release/ 2>/dev/null || true

          cd release
          tar -czvf digiwage-v3-linux-x86_64.tar.gz *

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: digiwage-v3-linux-x86_64
          path: release/digiwage-v3-linux-x86_64.tar.gz
          retention-days: 30