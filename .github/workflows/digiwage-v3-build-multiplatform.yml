name: Multi-Platform DigiWage Builds

on:
  push:
    branches:
      - digiwage-v3
  pull_request:
    branches:
      - digiwage-v3
  workflow_dispatch:

jobs:
  build-matrix:
    name: Build (${{ matrix.target.name }})
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        target:
          - name: "Linux x86_64"
            host: "x86_64-pc-linux-gnu"
            packages: "g++-x86-64-linux-gnu"
            artifact_ext: ".tar.gz"

          - name: "Linux ARM64"
            host: "aarch64-linux-gnu"
            packages: "g++-aarch64-linux-gnu binutils-aarch64-linux-gnu"
            artifact_ext: ".tar.gz"

          - name: "Windows x86_64"
            host: "x86_64-w64-mingw32"
            packages: "g++-mingw-w64-x86-64 mingw-w64-x86-64-dev nsis"
            artifact_ext: ".zip"

          - name: "macOS x86_64 (Intel)"
            host: "x86_64-apple-darwin"
            packages: "clang llvm libtinfo5"
            sdk_url: "https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX11.3.sdk.tar.xz"
            artifact_ext: ".tar.gz"

          - name: "macOS ARM64 (Apple Silicon)"
            host: "arm64-apple-darwin"
            packages: "clang llvm libtinfo5"
            sdk_url: "https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX11.3.sdk.tar.xz"
            artifact_ext: ".tar.gz"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: digiwage-v3
          submodules: recursive

      - name: Install Base Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libtool autotools-dev automake pkg-config \
            bsdmainutils python3 cmake curl zip unzip \
            ${{ matrix.target.packages }}

      - name: Configure MinGW POSIX Threading (Windows Only)
        if: matrix.target.host == 'x86_64-w64-mingw32'
        run: |
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix

      - name: Setup macOS SDK (macOS Targets Only)
        if: contains(matrix.target.host, 'apple-darwin')
        run: |
          mkdir -p depends/SDKs
          cd depends/SDKs
          curl -sL "${{ matrix.target.sdk_url }}" -o sdk.tar.xz
          tar -xf sdk.tar.xz
          
          EXTRACTED_DIR=$(ls -d MacOSX*.sdk 2>/dev/null | head -n 1)
          ln -s "$EXTRACTED_DIR" MacOSX.sdk 2>/dev/null || true
          echo "SDK_PATH=$(pwd)/MacOSX.sdk" >> $GITHUB_ENV

      - name: Pre-fetch missing dependency sources
        run: |
          if [ -d "depends" ]; then
            mkdir -p depends/sources
            if [ ! -f "depends/sources/gmp-6.2.1.tar.xz" ]; then
              curl -sL https://ftp.gnu.org/gnu/gmp/gmp-6.2.1.tar.xz -o depends/sources/gmp-6.2.1.tar.xz || \
              curl -sL https://gmplib.org/download/gmp/gmp-6.2.1.tar.xz -o depends/sources/gmp-6.2.1.tar.xz
            fi
          fi

      - name: Build In-Tree Dependencies
        run: |
          cd depends
          if [[ "${{ matrix.target.host }}" == *"apple-darwin"* ]]; then
            make -j$(nproc) HOST=${{ matrix.target.host }} SDK_PATH="${{ env.SDK_PATH }}"
          else
            make -j$(nproc) HOST=${{ matrix.target.host }}
          fi

      - name: Autogen & Configure
        run: |
          ./autogen.sh
          
          DEPENDS_PREFIX="$(pwd)/depends/${{ matrix.target.host }}"
          
          # Force Autotools to import site configuration compiled by depends
          export CONFIG_SITE="$DEPENDS_PREFIX/share/config.site"
          
          ./configure --prefix="$DEPENDS_PREFIX" \
                      --disable-maintainer-mode \
                      --disable-dependency-tracking \
                      --enable-static \
                      --disable-shared \
                      --with-gui=qt5

      - name: Compile Binaries
        run: |
          make -j$(nproc)

      - name: Package Release Binaries
        run: |
          mkdir -p release
          if [[ "${{ matrix.target.host }}" == *"mingw"* ]]; then
            cp src/digiwaged.exe release/ 2>/dev/null || cp src/bitcoind.exe release/ 2>/dev/null || true
            cp src/digiwage-cli.exe release/ 2>/dev/null || cp src/bitcoin-cli.exe release/ 2>/dev/null || true
            cp src/qt/digiwage-qt.exe release/ 2>/dev/null || cp src/qt/bitcoin-qt.exe release/ 2>/dev/null || true
            cd release && zip -r digiwage-v3-${{ matrix.target.host }}.zip *
          else
            cp src/digiwaged release/ 2>/dev/null || cp src/bitcoind release/ 2>/dev/null || true
            cp src/digiwage-cli release/ 2>/dev/null || cp src/bitcoin-cli release/ 2>/dev/null || true
            cp src/qt/digiwage-qt release/ 2>/dev/null || cp src/qt/bitcoin-qt release/ 2>/dev/null || true
            cd release && tar -czvf digiwage-v3-${{ matrix.target.host }}.tar.gz *
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: digiwage-v3-${{ matrix.target.host }}
          path: release/digiwage-v3-*${{ matrix.target.artifact_ext }}
          retention-days: 30