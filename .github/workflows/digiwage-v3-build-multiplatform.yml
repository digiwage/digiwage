name: Multi-Platform DigiWage Builds

on:
  push:
    branches:
      - digiwage-v3
  pull_request:
    branches:
      - digiwage-v3
  workflow_dispatch:

jobs:
  build-linux-windows:
    name: Build (${{ matrix.target.name }})
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        target:
          - name: "Linux x86_64"
            host: "x86_64-pc-linux-gnu"
            packages: "g++-x86-64-linux-gnu"
            artifact_ext: ".tar.gz"

          - name: "Linux ARM64"
            host: "aarch64-linux-gnu"
            packages: "g++-aarch64-linux-gnu binutils-aarch64-linux-gnu"
            artifact_ext: ".tar.gz"

          - name: "Windows x86_64"
            host: "x86_64-w64-mingw32"
            packages: "g++-mingw-w64-x86-64 mingw-w64-x86-64-dev nsis"
            artifact_ext: ".zip"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Base Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libtool autotools-dev automake pkg-config \
            bsdmainutils python3 cmake curl zip unzip \
            ${{ matrix.target.packages }}

      - name: Configure MinGW POSIX Threading (Windows Only)
        if: matrix.target.host == 'x86_64-w64-mingw32'
        run: |
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix

      - name: Pre-fetch missing dependency sources
        run: |
          if [ -d "depends" ]; then
            mkdir -p depends/sources
            if [ ! -f "depends/sources/gmp-6.2.1.tar.xz" ]; then
              curl -fsSL https://ftp.gnu.org/gnu/gmp/gmp-6.2.1.tar.xz \
                -o depends/sources/gmp-6.2.1.tar.xz || \
              curl -fsSL https://gmplib.org/download/gmp/gmp-6.2.1.tar.xz \
                -o depends/sources/gmp-6.2.1.tar.xz
            fi
          fi

      - name: Build In-Tree Dependencies
        run: |
          cd depends
          make -j"$(nproc)" HOST="${{ matrix.target.host }}"

      - name: Verify Target Qt5 Dependencies
        run: |
          DEPENDS_PREFIX="$PWD/depends/${{ matrix.target.host }}"

          echo "Target: ${{ matrix.target.host }}"
          echo "Depends prefix: $DEPENDS_PREFIX"

          test -d "$DEPENDS_PREFIX"

          echo "=== Qt5Svg files ==="
          find "$DEPENDS_PREFIX" \
            \( -name 'Qt5SvgConfig.cmake' \
               -o -name 'Qt5Svg.pc' \
               -o -name 'libQt5Svg*' \) \
            -print

          if ! find "$DEPENDS_PREFIX" \
            \( -name 'Qt5SvgConfig.cmake' \
               -o -name 'Qt5Svg.pc' \
               -o -name 'libQt5Svg*' \) \
            -print -quit | grep -q .; then
            echo "::error::Qt5Svg was not installed into $DEPENDS_PREFIX"
            exit 1
          fi

          echo "Qt5Svg target files detected."

      - name: Autogen & Configure
        run: |
          ./autogen.sh

          DEPENDS_PREFIX="$PWD/depends/${{ matrix.target.host }}"

          export CONFIG_SITE="$DEPENDS_PREFIX/share/config.site"

          echo "Using CONFIG_SITE=$CONFIG_SITE"

          ./configure --prefix="$DEPENDS_PREFIX" \
                      --disable-maintainer-mode \
                      --disable-dependency-tracking \
                      --enable-static \
                      --disable-shared \
                      --with-gui=qt5

      - name: Compile Binaries
        run: |
          make -j"$(nproc)"

      - name: Package Release Binaries
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          if [[ "${{ matrix.target.host }}" == *"mingw"* ]]; then
            if [[ -f src/digiwaged.exe ]]; then
              cp src/digiwaged.exe release/
            elif [[ -f src/bitcoind.exe ]]; then
              cp src/bitcoind.exe release/
            else
              echo "::error::Daemon executable was not produced."
              exit 1
            fi

            if [[ -f src/digiwage-cli.exe ]]; then
              cp src/digiwage-cli.exe release/
            elif [[ -f src/bitcoin-cli.exe ]]; then
              cp src/bitcoin-cli.exe release/
            else
              echo "::error::CLI executable was not produced."
              exit 1
            fi

            if [[ -f src/qt/digiwage-qt.exe ]]; then
              cp src/qt/digiwage-qt.exe release/
            elif [[ -f src/qt/bitcoin-qt.exe ]]; then
              cp src/qt/bitcoin-qt.exe release/
            else
              echo "::error::Qt executable was not produced."
              exit 1
            fi

            cd release
            zip -r "digiwage-v3-${{ matrix.target.host }}.zip" ./*.exe

          else
            if [[ -f src/digiwaged ]]; then
              cp src/digiwaged release/
            elif [[ -f src/bitcoind ]]; then
              cp src/bitcoind release/
            else
              echo "::error::Daemon executable was not produced."
              exit 1
            fi

            if [[ -f src/digiwage-cli ]]; then
              cp src/digiwage-cli release/
            elif [[ -f src/bitcoin-cli ]]; then
              cp src/bitcoin-cli release/
            else
              echo "::error::CLI executable was not produced."
              exit 1
            fi

            if [[ -f src/qt/digiwage-qt ]]; then
              cp src/qt/digiwage-qt release/
            elif [[ -f src/qt/bitcoin-qt ]]; then
              cp src/qt/bitcoin-qt release/
            else
              echo "::error::Qt executable was not produced."
              exit 1
            fi

            cd release
            tar -czvf "digiwage-v3-${{ matrix.target.host }}.tar.gz" ./*
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: digiwage-v3-${{ matrix.target.host }}
          path: release/digiwage-v3-*${{ matrix.target.artifact_ext }}
          if-no-files-found: error
          retention-days: 30

  build-macos:
    name: Build (${{ matrix.target.name }})
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        target:
          - name: "macOS x86_64 (Intel)"
            host: "x86_64-apple-darwin"
            runner: "macos-15-intel"

          - name: "macOS ARM64 (Apple Silicon)"
            host: "arm64-apple-darwin"
            runner: "macos-15"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # CHANGED: the Intel runner image ships with openssl@1.1 pre-linked.
      # Installing curl pulls in openssl@3 as a dependency, and `brew link`
      # then fails because it won't overwrite the existing openssl@1.1
      # symlinks. Unlink first and force-link openssl@3 afterward.
      - name: Install macOS Build Tools
        run: |
          brew update
          brew unlink openssl@1.1 || true
          brew install \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            coreutils \
            gnu-sed \
            curl \
            zip \
            unzip
          brew link --overwrite --force openssl@3

      # CHANGED: the original wrote two "PATH=..." lines to GITHUB_ENV, and the
      # second overwrote the first (coreutils was lost). GITHUB_PATH prepends
      # each entry properly.
      - name: Configure macOS Build Environment
        run: |
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix gnu-sed)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --show-sdk-version

      # NEW: Qt 5.15's bundled libpng includes <fp.h>, which modern macOS SDKs
      # no longer ship. Redirect it to <math.h>.
      - name: Patch Qt libpng (fp.h)
        run: |
          python3 - <<'EOF'
          p = 'depends/packages/qt.mk'
          s = open(p).read()
          marker = 'define $(package)_preprocess_cmds\n'
          line = ("  sed -i.old 's/include <fp.h>/include <math.h>/' "
                  "qtbase/src/3rdparty/libpng/pngpriv.h && \\\n")
          if 'pngpriv.h' not in s and marker in s:
              open(p, 'w').write(s.replace(marker, marker + line, 1))
              print('Patched qt.mk')
          else:
              print('qt.mk already patched or marker not found')
          EOF
          grep -n "pngpriv" depends/packages/qt.mk || true

      - name: Pre-fetch missing dependency sources
        run: |
          if [ -d "depends" ]; then
            mkdir -p depends/sources
            if [ ! -f "depends/sources/gmp-6.2.1.tar.xz" ]; then
              curl -fsSL https://ftp.gnu.org/gnu/gmp/gmp-6.2.1.tar.xz \
                -o depends/sources/gmp-6.2.1.tar.xz || \
              curl -fsSL https://gmplib.org/download/gmp/gmp-6.2.1.tar.xz \
                -o depends/sources/gmp-6.2.1.tar.xz
            fi
          fi

      # CHANGED: also install the modules macdeployqtplus needs for a fancy DMG.
      - name: Setup Python Build Environment
        run: |
          python3 -m venv "$RUNNER_TEMP/digiwage-python"
          "$RUNNER_TEMP/digiwage-python/bin/python" -m pip install --upgrade pip setuptools wheel
          "$RUNNER_TEMP/digiwage-python/bin/python" -m pip install ds_store mac_alias
          echo "$RUNNER_TEMP/digiwage-python/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/digiwage-python/bin/python" -c "import setuptools; print('setuptools', setuptools.__version__)"

      - name: Build In-Tree Dependencies
        run: |
          cd depends
          make -j"$(sysctl -n hw.ncpu)" HOST="${{ matrix.target.host }}"

      - name: Verify Target Qt5 Dependencies
        run: |
          DEPENDS_PREFIX="$PWD/depends/${{ matrix.target.host }}"

          echo "Target: ${{ matrix.target.host }}"
          echo "Depends prefix: $DEPENDS_PREFIX"

          test -d "$DEPENDS_PREFIX"

          echo "=== Qt5Svg files ==="
          find "$DEPENDS_PREFIX" \
            \( -name 'Qt5SvgConfig.cmake' \
               -o -name 'Qt5Svg.pc' \
               -o -name 'libQt5Svg*' \) \
            -print

      - name: Autogen & Configure
        run: |
          ./autogen.sh

          DEPENDS_PREFIX="$PWD/depends/${{ matrix.target.host }}"

          export CONFIG_SITE="$DEPENDS_PREFIX/share/config.site"

          echo "Using CONFIG_SITE=$CONFIG_SITE"

          ./configure --prefix="$DEPENDS_PREFIX" \
                      --disable-maintainer-mode \
                      --disable-dependency-tracking \
                      --enable-static \
                      --disable-shared \
                      --with-gui=qt5

      - name: Compile Binaries
        run: |
          make -j"$(sysctl -n hw.ncpu)"

      - name: Package Release Binaries (tar.gz)
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          if [[ -f src/digiwaged ]]; then
            cp src/digiwaged release/
          elif [[ -f src/bitcoind ]]; then
            cp src/bitcoind release/
          else
            echo "::error::Daemon executable was not produced."
            exit 1
          fi

          if [[ -f src/digiwage-cli ]]; then
            cp src/digiwage-cli release/
          elif [[ -f src/bitcoin-cli ]]; then
            cp src/bitcoin-cli release/
          else
            echo "::error::CLI executable was not produced."
            exit 1
          fi

          if [[ -f src/qt/digiwage-qt ]]; then
            cp src/qt/digiwage-qt release/
          elif [[ -f src/qt/bitcoin-qt ]]; then
            cp src/qt/bitcoin-qt release/
          else
            echo "::error::Qt executable was not produced."
            exit 1
          fi

          cd release
          tar -czvf "digiwage-v3-${{ matrix.target.host }}.tar.gz" ./*

      # NEW: produce the DMG. Try the repo's own `make deploy` first; if it
      # doesn't yield a .dmg, wrap the (statically linked) Qt binary in a
      # minimal .app bundle and build the DMG with hdiutil.
      - name: Create DMG
        shell: bash
        run: |
          set -euo pipefail
          HOST="${{ matrix.target.host }}"
          OUT="release/digiwage-v3-${HOST}.dmg"

          make deploy || echo "::warning::make deploy failed; using hdiutil fallback"

          DMG="$(find . -maxdepth 2 -name '*.dmg' -type f -not -path './release/*' | head -n 1 || true)"

          if [[ -n "$DMG" ]]; then
            echo "make deploy produced: $DMG"
            cp "$DMG" "$OUT"
          else
            echo "Building DMG with hdiutil fallback"
            APP="$(find . -maxdepth 3 -name '*.app' -type d -not -path './depends/*' | head -n 1 || true)"

            if [[ -z "$APP" ]]; then
              QT_BIN=""
              for c in src/qt/digiwage-qt src/qt/bitcoin-qt; do
                [[ -f "$c" ]] && QT_BIN="$c" && break
              done
              [[ -n "$QT_BIN" ]] || { echo "::error::No Qt binary to bundle."; exit 1; }

              APP="DigiWage-Qt.app"
              EXE="$(basename "$QT_BIN")"
              mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
              cp "$QT_BIN" "$APP/Contents/MacOS/$EXE"

              ICNS="$(find . -name '*.icns' -not -path './depends/*' | head -n 1 || true)"
              ICON_KEY=""
              if [[ -n "$ICNS" ]]; then
                cp "$ICNS" "$APP/Contents/Resources/app.icns"
                ICON_KEY="<key>CFBundleIconFile</key><string>app</string>"
              fi

              cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>DigiWage-Qt</string>
            <key>CFBundleDisplayName</key><string>DigiWage Core</string>
            <key>CFBundleIdentifier</key><string>org.digiwage.DigiWage-Qt</string>
            <key>CFBundleExecutable</key><string>${EXE}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>3</string>
            <key>NSHighResolutionCapable</key><true/>
            ${ICON_KEY}
          </dict></plist>
          PLIST
            fi

            hdiutil create -volname "DigiWage-Qt" -srcfolder "$APP" \
              -ov -format UDZO "$OUT"
          fi

          ls -la release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: digiwage-v3-${{ matrix.target.host }}
          path: |
            release/digiwage-v3-*.dmg
            release/digiwage-v3-*.tar.gz
          if-no-files-found: error
          retention-days: 30